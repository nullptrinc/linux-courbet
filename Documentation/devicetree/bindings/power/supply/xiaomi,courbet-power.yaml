%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/xiaomi,courbet-power.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi courbet PM6150 charging policy and battery gauge

maintainers:
  - moe-takasaki <199255379+moe-takasaki@users.noreply.github.com>

description: |
  Native control of the PM6150 QGauge at 0x4800, SMB5 charger at 0x1000,
  USB input at 0x1300, and ADC5 battery thermistor and input voltage channels.
  The driver owns normal charging limits, termination, thermal protection and
  QGauge FIFO coulomb accounting.
  The monitored battery supplies design values and OCV/temperature curves.
  Battery voltage/impedance anchors the coulomb counter at initialization/rest.

properties:
  compatible:
    const: xiaomi,courbet-power
  reg:
    maxItems: 1
  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
  power-supplies:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1
  interrupts:
    maxItems: 1
  interrupt-names:
    const: qg-fifo-done
  io-channels:
    maxItems: 3
  io-channel-names:
    items:
      - const: batt-therm
      - const: usbin-v
      - const: die-temp

required:
  - compatible
  - reg
  - monitored-battery
  - power-supplies
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names

additionalProperties: false
