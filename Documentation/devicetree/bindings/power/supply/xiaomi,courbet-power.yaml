%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/xiaomi,courbet-power.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi courbet PM6150 battery and USB telemetry

maintainers:
  - moe-takasaki <199255379+moe-takasaki@users.noreply.github.com>

description: |
  Read-only monitoring of the PM6150 QGauge at 0x4800, SMB5 charger at 0x1000,
  USB input at 0x1300, and ADC5 battery thermistor and input voltage channels.
  This board-specific driver does not initialize or alter the charger policy.
  The monitored battery supplies design values and OCV/temperature curves.
  Capacity is a terminal-voltage estimate, not a learned coulomb count.

properties:
  compatible:
    const: xiaomi,courbet-power
  reg:
    maxItems: 1
  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
  io-channels:
    maxItems: 2
  io-channel-names:
    items:
      - const: batt-therm
      - const: usbin-v

required:
  - compatible
  - reg
  - monitored-battery
  - io-channels
  - io-channel-names

additionalProperties: false
